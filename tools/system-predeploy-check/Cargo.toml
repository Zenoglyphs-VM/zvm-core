[package]
name = "zvm-system-predeploy-check"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
publish = false

[features]
default = []
serde = []

[dependencies]
revm = { version = "=42.0.1", default-features = false, features = ["std", "secp256k1", "portable", "c-kzg", "blst", "memory_limit"] }
alloy-trie = { version = "=0.9.5", default-features = false, features = ["std", "ethereum"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.149", features = ["raw_value"] }
sha2 = "=0.10.9"

[build-dependencies]
sha2 = "=0.10.9"
serde_json = "=1.0.149"

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false

[profile.release]
debug = 0
strip = true
codegen-units = 8
lto = false
