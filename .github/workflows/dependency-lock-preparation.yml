name: Dependency lock preparation

on:
  push:
    paths:
      - 'tools/dependency-review/remediation-lock-inputs.json'
      - 'tools/dependency-review/prepare_remediation_locks.py'
      - '.github/workflows/dependency-lock-preparation.yml'
  pull_request:
    paths:
      - 'tools/dependency-review/remediation-lock-inputs.json'
      - 'tools/dependency-review/prepare_remediation_locks.py'
      - '.github/workflows/dependency-lock-preparation.yml'

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      GOTOOLCHAIN: local
      GOTELEMETRY: 'off'
      REVIEW_SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.11'
          cache: false
      - name: Generate exact candidate locks without repository writeback
        env:
          GOMODCACHE: ${{ runner.temp }}/lock-preparation-modules
          GOCACHE: ${{ runner.temp }}/lock-preparation-build-cache
        run: |
          python3 -B tools/dependency-review/prepare_remediation_locks.py \
            --source-commit "$REVIEW_SOURCE_COMMIT" \
            --output "$RUNNER_TEMP/dependency-lock-preparation"
      - name: Retain candidate locks and actual command receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dependency-lock-candidate-go1.26.11
          path: ${{ runner.temp }}/dependency-lock-preparation/
          if-no-files-found: error
          retention-days: 14
