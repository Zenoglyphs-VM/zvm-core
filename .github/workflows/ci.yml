name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

# Linux, as most people who build this will be on.
jobs:
  go:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Prepare this job's fresh disposable Go compiler cache
        env:
          GOCACHE: ${{ runner.temp }}/zvm-owned-go-cache-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          python3 -B scripts/ci-owned-go-cache.py prepare
          printf '%s\n' "GOCACHE=$GOCACHE" >> "$GITHUB_ENV"

      - name: Run all original Go controls and prepare outputs within the measured disk budget
        run: python3 -B scripts/check-core-go-phase.py
      - name: Release only this job's completed disposable Go compiler cache
        run: python3 -B scripts/ci-owned-go-cache.py release
      - name: Check hosted system-qualification disk budget
        run: python3 -c "import json,os,shutil; free=shutil.disk_usage(os.environ['RUNNER_TEMP']).free; print('NATIVE-CI-DISK '+json.dumps({'freeBytes':free,'minimumFreeBytes':10<<30,'expectedNativeBytes':2<<30})); assert free >= (12 << 30)"
      - name: Select the pinned Rust compiler for the native OP system checker
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustc +1.95.0 --version
      - name: Acquire only the three source-locked OP modules
        run: python3 -B scripts/acquire-system-predeploy-sources.py "$RUNNER_TEMP/system-predeploy-op-source"
      - name: Build the bounded native system-call checker from the dependency lock
        env:
          ZVM_OP_REVM_SOURCES: ${{ runner.temp }}/system-predeploy-op-source
          CARGO_TARGET_DIR: ${{ runner.temp }}/system-predeploy-target
        run: cargo +1.95.0 build --release --locked --jobs 2 --manifest-path tools/system-predeploy-check/Cargo.toml
      - name: Execute all four native system-call profiles and deliberate refusal controls
        run: python3 -B scripts/check-system-predeploys.py --input "$RUNNER_TEMP/system-predeploy-input.json" --binary "$RUNNER_TEMP/system-predeploy-target/release/zvm-system-predeploy-check"
      - name: Qualify four connected profiles through the pinned complete OP client
        run: python3 -B scripts/check-connected-client.py "$RUNNER_TEMP/connected-client-check"
      - name: Verify controlled source restoration
        run: git diff --exit-code
